name: Python Greetings CI/CD

on:
  push:
    branches: [ main ]

jobs:
  install-pip-deps:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Clone python-greetings
        uses: actions/checkout@v4
        with:
          repository: mtararujs/python-greetings
          path: python-greetings

      - name: Install pip dependencies
        run: |
          echo "Installing all required dependencies..."
          pip3 install -r requirements.txt
        working-directory: python-greetings

  deploy-to-dev:
    needs: install-pip-deps
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to dev
        uses: ./.github/actions/deploy
        with:
          env_name: dev
          port: 7001

  tests-on-dev:
    needs: deploy-to-dev
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Tests on dev
        uses: ./.github/actions/tests
        with:
          env_name: dev

  deploy-to-staging:
    needs: tests-on-dev
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        uses: ./.github/actions/deploy
        with:
          env_name: staging
          port: 7002

  tests-on-staging:
    needs: deploy-to-staging
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Tests on staging
        uses: ./.github/actions/tests
        with:
          env_name: staging

  deploy-to-preprod:
    needs: tests-on-staging
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to preprod
        uses: ./.github/actions/deploy
        with:
          env_name: preprod
          port: 7003

  tests-on-preprod:
    needs: deploy-to-preprod
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Tests on preprod
        uses: ./.github/actions/tests
        with:
          env_name: preprod

  deploy-to-prod:
    needs: tests-on-preprod
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to prod
        uses: ./.github/actions/deploy
        with:
          env_name: prod
          port: 7004

  tests-on-prod:
    needs: deploy-to-prod
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Tests on prod
        uses: ./.github/actions/tests
        with:
          env_name: prod
