name: "Run Tests"
description: "Run tests against environment"
inputs:
  env_name:
    required: true

runs:
  using: composite
  steps:
    - name: Test results
      shell: cmd
      run: echo "Testing the app to ${{ inputs.env }} environment..."
    - uses: actions/checkout@v4
      with:
        repository: 'mtararujs/course-js-api-framework'
        path: course-js-api-framework
    - name: Setup tests on ${{ inputs.env }}
      shell: cmd
      working-directory: course-js-api-framework
      run: |
        npm install
        npm run greetings greetings_${{ inputs.env }}  